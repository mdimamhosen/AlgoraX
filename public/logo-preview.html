<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AlgoraX Logo Concepts Preview</title>
  <style>
    body { background: #000; color: #fff; font-family: monospace; padding: 40px; display: flex; flex-direction: column; gap: 40px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px; }
    .card { background: #0A0A0A; border: 1px solid #222; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 16px; align-items: center; }
    .card h3 { margin: 0; font-size: 14px; color: #A0A0A0; }
    .scales { display: flex; align-items: center; gap: 20px; }
  </style>
</head>
<body>
  <h1>AlgoraX Logo Variations</h1>
  <div class="grid">
    <!-- Concept 1: The Tensor Core (Interlocking Precision Chevrons) -->
    <div class="card">
      <h3>Concept 1: The Tensor Core</h3>
      <div class="scales">
        <!-- 64px -->
        <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
          <rect width="64" height="64" rx="14" fill="#111" stroke="#333" stroke-width="1.5"/>
          <path d="M18 46L32 18L46 46" stroke="#FFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M22 34H42" stroke="#FFF" stroke-width="4.5" stroke-linecap="round"/>
          <path d="M24 22L40 42" stroke="#888" stroke-width="3" stroke-linecap="round"/>
          <path d="M40 22L24 42" stroke="#888" stroke-width="3" stroke-linecap="round"/>
        </svg>

        <!-- 32px -->
        <svg width="32" height="32" viewBox="0 0 64 64" fill="none">
          <rect width="64" height="64" rx="14" fill="#111" stroke="#333" stroke-width="1.5"/>
          <path d="M18 46L32 18L46 46" stroke="#FFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M22 34H42" stroke="#FFF" stroke-width="4.5" stroke-linecap="round"/>
        </svg>

        <!-- 20px -->
        <svg width="20" height="20" viewBox="0 0 64 64" fill="none">
          <rect width="64" height="64" rx="14" fill="#111"/>
          <path d="M18 46L32 18L46 46" stroke="#FFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M22 34H42" stroke="#FFF" stroke-width="5" stroke-linecap="round"/>
        </svg>
      </div>
    </div>

    <!-- Concept 2: The Monolithic Delta-X (Solid Aerospace Polygon) -->
    <div class="card">
      <h3>Concept 2: The Monolithic Delta-X</h3>
      <div class="scales">
        <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
          <rect width="64" height="64" rx="14" fill="#111" stroke="#333" stroke-width="1.5"/>
          <!-- Bold solid stylized A with cutaway that forms X -->
          <path d="M32 12L14 48H23L32 29L41 48H50L32 12Z" fill="#FFF"/>
          <!-- Counter-blade forming X -->
          <polygon points="26,35 38,35 44,48 37,48 32,38 27,48 20,48" fill="#FFF"/>
        </svg>
        <svg width="32" height="32" viewBox="0 0 64 64" fill="none">
          <rect width="64" height="64" rx="14" fill="#111" stroke="#333" stroke-width="1.5"/>
          <path d="M32 12L14 48H23L32 29L41 48H50L32 12Z" fill="#FFF"/>
        </svg>
      </div>
    </div>

    <!-- Concept 3: The Algorithmic Nexus (Interlocking Geometric Blades) -->
    <div class="card">
      <h3>Concept 3: The Algorithmic Nexus</h3>
      <div class="scales">
        <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
          <rect width="64" height="64" rx="14" fill="#0C0C0C" stroke="#2A2A2A" stroke-width="1.5"/>
          <!-- Upper chevron / delta -->
          <path d="M32 14L48 30L41 37L32 28L23 37L16 30L32 14Z" fill="#FFF"/>
          <!-- Lower counter chevron forming X nexus -->
          <path d="M32 50L16 34L23 27L32 36L41 27L48 34L32 50Z" fill="#E0E0E0"/>
        </svg>
        <svg width="32" height="32" viewBox="0 0 64 64" fill="none">
          <rect width="64" height="64" rx="14" fill="#0C0C0C" stroke="#2A2A2A" stroke-width="1.5"/>
          <path d="M32 14L48 30L41 37L32 28L23 37L16 30L32 14Z" fill="#FFF"/>
          <path d="M32 50L16 34L23 27L32 36L41 27L48 34L32 50Z" fill="#E0E0E0"/>
        </svg>
      </div>
    </div>

    <!-- Concept 4: The Hyper-Sleek Modernist AX (Vercel/Linear Style) -->
    <div class="card">
      <h3>Concept 4: Hyper-Sleek Minimalist AX</h3>
      <div class="scales">
        <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
          <rect width="64" height="64" rx="14" fill="#000" stroke="#333" stroke-width="1.5"/>
          <!-- Bold sharp minimal A with right diagonal extending into X cross -->
          <!-- Left leg -->
          <rect x="15" y="16" width="6.5" height="36" rx="3.25" transform="rotate(-22 15 16)" fill="#FFF"/>
          <!-- Right leg -->
          <rect x="42" y="14" width="6.5" height="36" rx="3.25" transform="rotate(22 42 14)" fill="#FFF"/>
          <!-- Center bridge -->
          <rect x="23" y="34" width="18" height="5.5" rx="2.75" fill="#FFF"/>
          <!-- Diagonal cross element that creates X in the negative space -->
          <circle cx="32" cy="18" r="3" fill="#FFF"/>
        </svg>
      </div>
    </div>
  </div>
</body>
</html>
